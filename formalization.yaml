sources:
- type: manuscript
  title: Statistical thresholds for Tensor PCA — maintainer’s local revision for autoformalization
  authors:
  - Patrick Lopatto
  id: Statistical thresholds for Tensor PCA, maintainer’s local revision for autoformalization
  relationship: formalizes
  note: Patrick Lopatto alone prepared and is responsible for the revisions and expansions in this local
    version, created to facilitate autoformalization. Its underlying source is the paper by Aukosh Jagannath,
    Patrick Lopatto and Léo Miolane, cited separately below. The local formulation uses absolute-overlap
    estimator optimality, zero-overlap global maximality for 0 ≤ λ ≤ λc, an infimum variational value
    and the displayed continuous four-parameter family. The four-parameter export proves equality of
    infima, without unrestricted minimizer attainment. The local manuscript is not distributed; Challenge
    provides the exact formalized statements and hypotheses, and README gives the source-number correspondence
    and scope.
