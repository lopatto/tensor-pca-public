version: v0.4
project:
  name: Statistical thresholds for Tensor PCA
  description: We formalize in Lean the principal statistical and constrained-landscape results of Statistical
    thresholds for Tensor PCA by Jagannath, Lopatto and Miolane, following a local expanded manuscript prepared
    solely by Patrick Lopatto, the formalization’s maintainer. This elaborated manuscript was prepared
    to facilitate autoformalization. At nonnegative signal strength in the ordered Gaussian tensor model,
    we prove the detection threshold below and above criticality for even orders k ≥ 6. For k ≥ 3, we
    prove the maximum-likelihood value limit at every nonnegative signal strength and the maximum-likelihood
    absolute-overlap limit away from criticality. We prove optimality bounds for independently randomized
    measurable unit estimators at nonnegative noncritical strengths, and tensor MMSE formulas at positive
    noncritical strengths. We also prove the discontinuous overlap transition, consistent testing among
    fixed nonempty finite families of distinct supercritical strengths, constrained expected and almost-sure
    energy limits for signed overlaps in [-1,1], and associated variational and landscape conclusions.
    Almost-sure limits concern fixed parameters and allow arbitrary coupling across dimensions. For
    interior overlaps, the four-parameter variational reduction establishes equality of infima; unrestricted
    minimizer attainment is not claimed.
  authors:
  - Patrick Lopatto
  responsible_maintainers:
  - Patrick Lopatto
  license: Apache-2.0
